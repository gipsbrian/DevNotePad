# Ports are overridable (compose reads them from the root .env too) and
# default to 8010/5180 rather than 8000/5173, which commonly clash with
# other local services. The browser talks to the backend directly, so
# VITE_API_BASE_URL and CORS_ORIGINS both use the host-side ports.
services:
  backend:
    build: ./backend
    container_name: devnotepad-backend
    restart: unless-stopped
    env_file:
      - .env
    environment:
      - DATABASE_PATH=/app/data/devnotepad.db
      - CORS_ORIGINS=["http://localhost:${FRONTEND_PORT:-5180}"]
    ports:
      - "127.0.0.1:${BACKEND_PORT:-8010}:8000"
    volumes:
      - devnotepad-data:/app/data

  frontend:
    build: ./frontend
    container_name: devnotepad-frontend
    restart: unless-stopped
    environment:
      # The browser reaches the backend directly on the host port. Behind a
      # reverse proxy that serves the API on the same origin, set
      # VITE_API_BASE_URL= (empty) in .env so the SPA uses relative /api.
      - VITE_API_BASE_URL=${VITE_API_BASE_URL-http://localhost:${BACKEND_PORT:-8010}}
      # Hostnames a reverse proxy forwards, so the dev server accepts them.
      - VITE_ALLOWED_HOSTS=${VITE_ALLOWED_HOSTS-}
    ports:
      - "127.0.0.1:${FRONTEND_PORT:-5180}:5173"
    volumes:
      - ./frontend:/app
      # Named volume so the container keeps its own Linux-built modules
      # instead of the host's. NOTE: it is only seeded from the image the
      # first time. After adding a dependency, `up --build` alone keeps the
      # stale volume — use `make docker-reset` to drop and re-seed it.
      - frontend-node-modules:/app/node_modules
    depends_on:
      - backend

volumes:
  # Explicit names so tooling can target one volume without guessing the
  # compose project prefix — `make docker-reset` drops only the modules
  # volume and must never touch devnotepad-data (boards + local notes).
  devnotepad-data:
    name: devnotepad-data
  frontend-node-modules:
    name: devnotepad-frontend-node-modules
